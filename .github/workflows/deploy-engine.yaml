name: Deploy Scraper Engine (gosom + rank)

# Yalnız motor dosyaları değişince çalışır; wrapper yayını (deploy.yaml) ayrıdır.
on:
  push:
    branches: [ main ]
    paths:
      - 'engine/**'
      - '.github/workflows/deploy-engine.yaml'
  workflow_dispatch:

jobs:
  deploy-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push engine image
        uses: docker/build-push-action@v4
        with:
          context: ./engine
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/scraper-geolocalrank-engine:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/scraper-geolocalrank-engine:latest

      # Manifestte motor satırı henüz gosom/google-maps-scraper:latest-rod ise
      # bu adım hiçbir şey değiştirmez. Motoru bu imaja geçirme işi bir kez
      # elle yapılır; sonraki yayınları bu adım taşır.
      - name: Update Kubernetes manifest
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git clone https://${{ secrets.GH_PAT }}@github.com/${{ secrets.K8S_REPO }}.git k8s-repo
          cd k8s-repo

          sed -i "s|image: .*/scraper-geolocalrank-engine:.*|image: ${{ secrets.DOCKER_USERNAME }}/scraper-geolocalrank-engine:${{ github.sha }}|" scraper/*.yaml

          grep -rn "image:" scraper/ || true

          if git diff --quiet; then
            echo "Manifestte scraper-geolocalrank-engine satırı yok; motor henüz bu imaja geçirilmemiş."
            exit 0
          fi

          git add scraper/
          git commit -m "Update scraper-geolocalrank-engine image to ${{ github.sha }}"
          git push
